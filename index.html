<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Expense Tracker</title>

<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Expense Tracker" />
<meta name="theme-color" content="#FF5A5F" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    --bg: #FFF4E0;
    --paper: #FFFFFF;
    --ink: #1A1A2E;
    --ink-soft: #6B6B85;
    --line: #1A1A2E;
    --accent: #FF5A5F;
    --accent-soft: #FFE1E2;
    --brick: #D7263D;
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) 20px 40px;
  }

  .month-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .month-label { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; }
  .month-nav { display: flex; gap: 6px; }
  .type-filter { display: flex; gap: 6px; margin-bottom: 18px; }
  .type-filter-btn {
    flex: 1; padding: 8px 6px; border: 2px solid var(--ink); border-radius: 10px; background: var(--paper);
    color: var(--ink); font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 12.5px;
    cursor: pointer; transition: background 0.12s, color 0.12s;
  }
  .type-filter-btn.active { background: var(--ink); color: #fff; }
  .icon-btn {
    background: var(--paper); border: 2px solid var(--ink); cursor: pointer; color: var(--ink);
    padding: 5px; display: flex; align-items: center; border-radius: 50%;
    transition: transform 0.12s, background 0.12s;
  }
  .icon-btn:hover { background: var(--accent-soft); transform: translateY(-1px); }
  .icon-btn[disabled] { opacity: 0.3; cursor: default; }
  .icon-btn[disabled]:hover { transform: none; background: var(--paper); }

  .total-block {
    margin-bottom: 22px; background: var(--accent); border: 3px solid var(--ink);
    border-radius: 22px; padding: 24px 22px; box-shadow: 7px 7px 0 var(--ink);
  }
  .total-amount {
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 48px; line-height: 1;
    font-variant-numeric: tabular-nums; letter-spacing: -0.01em; color: #fff;
  }
  .total-sub { margin-top: 8px; font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.85); }

  .add-toggle {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 13px; background: var(--ink); color: #fff; border: 3px solid var(--ink);
    border-radius: 14px; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px;
    cursor: pointer; box-shadow: 5px 5px 0 var(--accent); transition: transform 0.12s, box-shadow 0.12s;
  }
  .add-toggle:hover { transform: translate(-2px,-2px); box-shadow: 7px 7px 0 var(--accent); }

  .add-form {
    background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; padding: 18px;
    margin-top: 12px; display: flex; flex-direction: column; gap: 14px; box-shadow: 5px 5px 0 var(--ink);
  }
  .field-row { display: flex; gap: 10px; }
  .field { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); }
  .field input, .field select {
    font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; padding: 9px 11px;
    border: 2px solid var(--ink); border-radius: 10px; background: var(--bg); color: var(--ink); width: 100%;
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .amount-input { font-family: 'Space Grotesk', sans-serif; font-weight: 600; }

  .submit-btn {
    align-self: flex-end; padding: 10px 20px; background: var(--accent); color: #fff;
    border: 2px solid var(--ink); border-radius: 10px; font-family: 'Space Grotesk', sans-serif;
    font-weight: 600; font-size: 13px; cursor: pointer; box-shadow: 3px 3px 0 var(--ink);
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .submit-btn:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--ink); }

  .field-error { font-size: 11.5px; font-weight: 600; color: var(--brick); }

  .section-label {
    font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase; margin: 30px 0 14px;
  }

  .cat-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .cat-bar-name { font-size: 13px; font-weight: 600; width: 92px; flex-shrink: 0; }
  .cat-bar-track { flex: 1; height: 10px; background: var(--paper); border: 2px solid var(--ink); border-radius: 20px; overflow: hidden; }
  .cat-bar-fill { height: 100%; border-radius: 20px 0 0 20px; }
  .cat-bar-amt { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 12.5px; width: 78px; text-align: right; flex-shrink: 0; }

  .pay-table { width: 100%; border-collapse: collapse; }
  .pay-table td { padding: 8px 0; font-size: 13px; border-bottom: 1px solid var(--accent-soft); }
  .pay-table tr:last-child td { border-bottom: none; }
  .pay-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; vertical-align: middle; border: 1px solid var(--ink); }
  .pay-count { text-align: right; color: var(--ink-soft); font-size: 11px; font-weight: 500; width: 50px; }
  .pay-pct { text-align: right; color: var(--ink-soft); font-size: 12px; font-weight: 600; width: 50px; }
  .pay-amt { text-align: right; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 12.5px; width: 90px; }

  .empty-note { font-size: 13px; color: var(--ink-soft); padding: 10px 0; }

  .row {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 2px solid var(--ink);
    border-radius: 14px; margin-bottom: 10px; background: var(--paper);
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .row:hover { transform: translate(-2px,-2px); box-shadow: 4px 4px 0 var(--ink); }
  .row-tick { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; border: 2px solid var(--ink); }
  .row-main { flex: 1; min-width: 0; }
  .row-note { font-size: 14px; font-weight: 600; }
  .row-meta { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; font-weight: 500; }
  .row-amount { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px; flex-shrink: 0; }
  .row-delete {
    background: none; border: none; color: var(--ink-soft); cursor: pointer; padding: 4px;
    flex-shrink: 0; border-radius: 8px; transition: color 0.15s, background 0.15s;
  }
  .row-delete:hover, .row-delete.confirm { color: var(--brick); background: var(--accent-soft); }

  .footer-row { display: flex; justify-content: flex-end; margin-top: 18px; }
  .export-btn {
    display: flex; align-items: center; gap: 6px; background: var(--paper); border: 2px solid var(--ink);
    border-radius: 20px; color: var(--ink); font-size: 12px; font-weight: 600; cursor: pointer;
    padding: 7px 14px; transition: transform 0.12s;
  }
  .export-btn:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--ink); }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  "use strict";

  var CATEGORIES = [
    { name: "Groceries", color: "#06D6A0" },
    { name: "Transport", color: "#3A86FF" },
    { name: "Food", color: "#FF5A5F" },
    { name: "Travel", color: "#00B4D8" },
    { name: "Shopping", color: "#8338EC" },
    { name: "Entertainment", color: "#FF006E" },
    { name: "Bills", color: "#FFC43D" },
    { name: "Salaries", color: "#3D5A80" },
    { name: "Other", color: "#6C757D" }
  ];
  var PAYMENT_METHODS = ["Cash", "UPI", "Credit Card", "Other"];
  var PAYMENT_COLORS = { "Cash": "#FB8500", "UPI": "#219EBC", "Credit Card": "#8338EC", "Other": "#6C757D" };
  var TYPES = ["Personal", "Home", "Other"];
  var MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var STORAGE_KEY = "expense_tracker_entries";

  var ICONS = {
    plus: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
    trash: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>',
    download: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
    chevronLeft: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>',
    chevronRight: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>'
  };

  function catColor(name) {
    var c = CATEGORIES.filter(function (c) { return c.name === name; })[0];
    return c ? c.color : "#6C757D";
  }

  function inr(n) {
    return new Intl.NumberFormat("en-IN", { style: "currency", currency: "INR", maximumFractionDigits: 0 }).format(n);
  }

  function todayStr() {
    return new Date().toISOString().slice(0, 10);
  }

  function uid() {
    return Date.now() + "-" + Math.random().toString(36).slice(2, 8);
  }

  function loadExpenses() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveExpenses(list) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    } catch (e) {
      console.error("Storage error:", e);
    }
  }

  // ---- state ----
  var state = {
    expenses: loadExpenses(),
    viewDate: new Date(),
    formOpen: false,
    noteError: false,
    confirmDeleteId: null,
    filterType: "All"
  };

  function monthExpenses() {
    var y = state.viewDate.getFullYear(), m = state.viewDate.getMonth();
    return state.expenses
      .filter(function (e) {
        var d = new Date(e.date);
        var inMonth = d.getFullYear() === y && d.getMonth() === m;
        var matchesType = state.filterType === "All" || e.type === state.filterType;
        return inMonth && matchesType;
      })
      .sort(function (a, b) { return a.date < b.date ? 1 : -1; });
  }

  function categoryBreakdown(list) {
    var map = {};
    CATEGORIES.forEach(function (c) { map[c.name] = 0; });
    list.forEach(function (e) { map[e.category] = (map[e.category] || 0) + Number(e.amount); });
    var max = Math.max.apply(null, [1].concat(Object.keys(map).map(function (k) { return map[k]; })));
    return CATEGORIES
      .map(function (c) { return { name: c.name, color: c.color, total: map[c.name], pct: (map[c.name] / max) * 100 }; })
      .filter(function (c) { return c.total > 0; })
      .sort(function (a, b) { return b.total - a.total; });
  }

  function paymentBreakdown(list) {
    var map = {}, count = {};
    PAYMENT_METHODS.forEach(function (p) { map[p] = 0; count[p] = 0; });
    list.forEach(function (e) {
      var p = e.payment || "Cash";
      map[p] = (map[p] || 0) + Number(e.amount);
      count[p] = (count[p] || 0) + 1;
    });
    var total = list.reduce(function (s, e) { return s + Number(e.amount); }, 0);
    return PAYMENT_METHODS
      .map(function (p) { return { name: p, color: PAYMENT_COLORS[p], total: map[p], count: count[p], pct: total > 0 ? (map[p] / total) * 100 : 0 }; })
      .filter(function (p) { return p.total > 0; })
      .sort(function (a, b) { return b.total - a.total; });
  }

  function isCurrentMonth() {
    var now = new Date();
    return state.viewDate.getFullYear() === now.getFullYear() && state.viewDate.getMonth() === now.getMonth();
  }

  function esc(s) {
    var div = document.createElement("div");
    div.textContent = s == null ? "" : String(s);
    return div.innerHTML.replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function render() {
    var list = monthExpenses();
    var total = list.reduce(function (s, e) { return s + Number(e.amount); }, 0);
    var breakdown = categoryBreakdown(list);
    var payBreakdown = paymentBreakdown(list);
    var monthLabel = MONTH_NAMES[state.viewDate.getMonth()] + " " + state.viewDate.getFullYear();

    var html = "";

    html += '<div class="month-row">';
    html += '  <span class="month-label">' + monthLabel + '</span>';
    html += '  <div class="month-nav">';
    html += '    <button class="icon-btn" data-action="prev-month" aria-label="Previous month">' + ICONS.chevronLeft + '</button>';
    html += '    <button class="icon-btn" data-action="next-month" aria-label="Next month"' + (isCurrentMonth() ? ' disabled' : '') + '>' + ICONS.chevronRight + '</button>';
    html += '  </div>';
    html += '</div>';

    html += '<div class="total-block">';
    html += '  <div class="total-amount">' + inr(total) + '</div>';
    html += '  <div class="total-sub">' + list.length + (list.length === 1 ? ' expense' : ' expenses') + ' this month' + (state.filterType !== "All" ? ' &middot; ' + esc(state.filterType) : '') + '</div>';
    html += '</div>';

    if (!state.formOpen) {
      html += '<button class="add-toggle" data-action="open-form">' + ICONS.plus + ' Add expense</button>';
    } else {
      html += renderForm();
    }

    html += '<div class="section-label">Viewing</div>';
    html += '<div class="type-filter">';
    ["All"].concat(TYPES).forEach(function (t) {
      html += '<button type="button" class="type-filter-btn' + (state.filterType === t ? ' active' : '') + '" data-action="filter-type" data-type="' + t + '">' + t + '</button>';
    });
    html += '</div>';

    if (breakdown.length > 0) {
      html += '<div class="section-label">By category</div>';
      breakdown.forEach(function (c) {
        html += '<div class="cat-bar-row">';
        html += '  <span class="cat-bar-name">' + esc(c.name) + '</span>';
        html += '  <div class="cat-bar-track"><div class="cat-bar-fill" style="width:' + c.pct + '%;background:' + c.color + '"></div></div>';
        html += '  <span class="cat-bar-amt">' + inr(c.total) + '</span>';
        html += '</div>';
      });
    }

    if (payBreakdown.length > 0) {
      html += '<div class="section-label">By payment method</div>';
      html += '<table class="pay-table"><tbody>';
      payBreakdown.forEach(function (p) {
        html += '<tr>';
        html += '  <td><span class="pay-dot" style="background:' + p.color + '"></span>' + esc(p.name) + '</td>';
        html += '  <td class="pay-count">' + p.count + (p.count === 1 ? ' txn' : ' txns') + '</td>';
        html += '  <td class="pay-pct">' + p.pct.toFixed(0) + '%</td>';
        html += '  <td class="pay-amt">' + inr(p.total) + '</td>';
        html += '</tr>';
      });
      html += '</tbody></table>';
    }

    html += '<div class="section-label">Entries</div>';
    if (list.length === 0) {
      html += '<div class="empty-note">No expenses logged for this month yet.</div>';
    } else {
      list.forEach(function (e) {
        var isConfirm = state.confirmDeleteId === e.id;
        var dateLabel = new Date(e.date).toLocaleDateString("en-IN", { day: "numeric", month: "short" });
        html += '<div class="row">';
        html += '  <div class="row-tick" style="background:' + catColor(e.category) + '"></div>';
        html += '  <div class="row-main">';
        html += '    <div class="row-note">' + esc(e.note || e.category) + '</div>';
        html += '    <div class="row-meta">' + dateLabel + ' &middot; ' + esc(e.category) + ' &middot; ' + esc(e.payment || "Cash") + ' &middot; ' + esc(e.type || "Personal") + '</div>';
        html += '  </div>';
        html += '  <div class="row-amount">' + inr(e.amount) + '</div>';
        html += '  <button class="row-delete' + (isConfirm ? ' confirm' : '') + '" data-action="delete" data-id="' + e.id + '" aria-label="Delete entry">' + ICONS.trash + '</button>';
        html += '</div>';
      });
    }

    html += '<div class="footer-row"><button class="export-btn" data-action="export">' + ICONS.download + ' Export Excel</button></div>';

    document.getElementById("app").innerHTML = html;
    attachFormHandlers();
  }

  function noteRequired(vals) {
    return vals.category === "Other" || vals.payment === "Other" || vals.type === "Other";
  }

  function renderForm() {
    var f = state.formValues || { amount: "", category: CATEGORIES[0].name, note: "", date: todayStr(), payment: PAYMENT_METHODS[0], type: TYPES[0] };
    var required = noteRequired(f);
    var html = '<form class="add-form" id="expense-form">';
    html += '  <div class="field-row">';
    html += '    <div class="field" style="flex:0 0 120px">';
    html += '      <label for="f-amount">Amount</label>';
    html += '      <input id="f-amount" class="amount-input" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" value="' + esc(f.amount) + '" />';
    html += '    </div>';
    html += '    <div class="field">';
    html += '      <label for="f-date">Date</label>';
    html += '      <input id="f-date" type="date" value="' + esc(f.date) + '" />';
    html += '    </div>';
    html += '  </div>';
    html += '  <div class="field-row">';
    html += '    <div class="field">';
    html += '      <label for="f-category">Category</label>';
    html += '      <select id="f-category" style="border-left:4px solid ' + catColor(f.category) + '">';
    CATEGORIES.forEach(function (c) {
      html += '<option value="' + c.name + '"' + (c.name === f.category ? ' selected' : '') + '>' + c.name + '</option>';
    });
    html += '      </select>';
    html += '    </div>';
    html += '    <div class="field">';
    html += '      <label for="f-payment">Payment</label>';
    html += '      <select id="f-payment">';
    PAYMENT_METHODS.forEach(function (p) {
      html += '<option value="' + p + '"' + (p === f.payment ? ' selected' : '') + '>' + p + '</option>';
    });
    html += '      </select>';
    html += '    </div>';
    html += '  </div>';
    html += '  <div class="field">';
    html += '    <label for="f-type">Type</label>';
    html += '    <select id="f-type">';
    TYPES.forEach(function (t) {
      html += '<option value="' + t + '"' + (t === f.type ? ' selected' : '') + '>' + t + '</option>';
    });
    html += '    </select>';
    html += '  </div>';
    html += '  <div class="field">';
    html += '    <label for="f-note" id="f-note-label">Note' + (required ? ' (required)' : '') + '</label>';
    html += '    <input id="f-note" type="text" placeholder="' + (required ? "What was it for?" : "What was it for? (optional)") + '" value="' + esc(f.note) + '"' + (state.noteError ? ' style="border-color:var(--brick)"' : '') + ' />';
    if (state.noteError) html += '    <span class="field-error" id="f-note-error">A note is required when Category, Payment, or Type is &quot;Other&quot;.</span>';
    html += '  </div>';
    html += '  <button type="submit" class="submit-btn">Save</button>';
    html += '</form>';
    return html;
  }

  function attachFormHandlers() {
    var form = document.getElementById("expense-form");
    if (!form) return;
    ["f-category", "f-payment", "f-type"].forEach(function (id) {
      document.getElementById(id).addEventListener("change", function () {
        state.formValues = readFormValues();
        updateFormReactiveBits();
      });
    });
    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      var vals = readFormValues();
      var amt = parseFloat(vals.amount);
      if (!amt || amt <= 0) return;
      if (noteRequired(vals) && !vals.note.trim()) {
        state.formValues = vals;
        state.noteError = true;
        render();
        return;
      }
      var entry = { id: uid(), amount: amt, category: vals.category, payment: vals.payment, type: vals.type, note: vals.note.trim(), date: vals.date };
      state.expenses = [entry].concat(state.expenses);
      saveExpenses(state.expenses);
      state.formOpen = false;
      state.formValues = null;
      state.noteError = false;
      render();
    });
    document.getElementById("f-amount").focus();
  }

  // Updates the small reactive bits of the open form (category color bar,
  // note required label/placeholder) WITHOUT rebuilding the form's HTML.
  // Rebuilding the DOM mid-selection is what caused iOS's native picker
  // to need two taps to register a choice.
  function updateFormReactiveBits() {
    var vals = readFormValues();
    var catSelect = document.getElementById("f-category");
    if (catSelect) catSelect.style.borderLeft = "4px solid " + catColor(vals.category);

    var required = noteRequired(vals);
    var noteLabel = document.getElementById("f-note-label");
    var noteInput = document.getElementById("f-note");
    if (noteLabel) noteLabel.textContent = "Note" + (required ? " (required)" : "");
    if (noteInput) noteInput.placeholder = required ? "What was it for?" : "What was it for? (optional)";

    if (!required && state.noteError) {
      state.noteError = false;
      if (noteInput) noteInput.style.borderColor = "";
      var errorSpan = document.getElementById("f-note-error");
      if (errorSpan) errorSpan.remove();
    }
  }

  function readFormValues() {
    return {
      amount: document.getElementById("f-amount").value,
      category: document.getElementById("f-category").value,
      payment: document.getElementById("f-payment").value,
      type: document.getElementById("f-type").value,
      note: document.getElementById("f-note").value,
      date: document.getElementById("f-date").value
    };
  }

  function categoryTotalsFor(list) {
    var map = {};
    list.forEach(function (e) { map[e.category] = (map[e.category] || 0) + Number(e.amount); });
    return map;
  }

  function exportExcel() {
    var sorted = state.expenses.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    var entriesData = [["Date", "Month", "Category", "Payment", "Type", "Note", "Amount (INR)"]];
    sorted.forEach(function (e) {
      var d = new Date(e.date);
      var monthLabel = MONTH_NAMES[d.getMonth()] + " " + d.getFullYear();
      entriesData.push([e.date, monthLabel, e.category, e.payment || "Cash", e.type || "Personal", e.note || "", e.amount]);
    });
    var entriesSheet = XLSX.utils.aoa_to_sheet(entriesData);
    entriesSheet["!cols"] = [{ wch: 12 }, { wch: 14 }, { wch: 16 }, { wch: 14 }, { wch: 12 }, { wch: 30 }, { wch: 14 }];

    var summaryData = [];
    var sections = ["All"].concat(TYPES);
    sections.forEach(function (sec, idx) {
      var subset = sec === "All" ? sorted : sorted.filter(function (e) { return (e.type || "Personal") === sec; });
      var map = categoryTotalsFor(subset);
      var grand = subset.reduce(function (s, e) { return s + Number(e.amount); }, 0);
      if (idx > 0) summaryData.push([]);
      summaryData.push([sec.toUpperCase() + " — By Category", ""]);
      summaryData.push(["Category", "Total (INR)"]);
      CATEGORIES.forEach(function (c) {
        if (map[c.name]) summaryData.push([c.name, map[c.name]]);
      });
      summaryData.push(["Grand Total", grand]);
    });

    summaryData.push([]);
    summaryData.push(["ALL — By Payment Method", ""]);
    summaryData.push(["Payment Method", "Total (INR)"]);
    var payBreakdownAll = paymentBreakdown(sorted);
    payBreakdownAll.forEach(function (p) { summaryData.push([p.name, p.total]); });

    var summarySheet = XLSX.utils.aoa_to_sheet(summaryData);
    summarySheet["!cols"] = [{ wch: 22 }, { wch: 14 }];

    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, entriesSheet, "All Entries");
    XLSX.utils.book_append_sheet(wb, summarySheet, "Summary");
    XLSX.writeFile(wb, "expenses.xlsx");
  }

  document.getElementById("app").addEventListener("click", function (ev) {
    var btn = ev.target.closest("[data-action]");
    if (!btn) return;
    var action = btn.getAttribute("data-action");

    if (action === "prev-month") {
      state.viewDate = new Date(state.viewDate.getFullYear(), state.viewDate.getMonth() - 1, 1);
      render();
    } else if (action === "next-month") {
      if (!isCurrentMonth()) {
        state.viewDate = new Date(state.viewDate.getFullYear(), state.viewDate.getMonth() + 1, 1);
        render();
      }
    } else if (action === "open-form") {
      state.formOpen = true;
      state.formValues = null;
      state.noteError = false;
      render();
    } else if (action === "filter-type") {
      state.filterType = btn.getAttribute("data-type");
      render();
    } else if (action === "delete") {
      var id = btn.getAttribute("data-id");
      if (state.confirmDeleteId === id) {
        state.expenses = state.expenses.filter(function (e) { return e.id !== id; });
        saveExpenses(state.expenses);
        state.confirmDeleteId = null;
        render();
      } else {
        state.confirmDeleteId = id;
        render();
      }
    } else if (action === "export") {
      exportExcel();
    }
  });

  render();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("service-worker.js").catch(function (e) {
        console.error("Service worker registration failed:", e);
      });
    });
  }
})();
</script>
</body>
</html>
